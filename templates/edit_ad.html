{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Редактирование объявления</h5>
                <a href="/ads/{{ ad.id }}" class="btn btn-outline-secondary btn-sm">Отмена</a>
            </div>
            <div class="card-body">
                <form action="/web/ads/{{ ad.id }}/edit" method="post">
                    <div class="mb-3">
                        <label class="form-label">Название</label>
                        <input type="text" name="title" class="form-control" value="{{ ad.title }}" required minlength="3">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Категория</label>
                        <select name="category" class="form-select">
                            {% for cat in categories %}
                                {% if cat != "Все категории" %}
                                    <option value="{{ cat }}" {% if ad.category == cat %}selected{% endif %}>{{ cat }}</option>
                                {% endif %}
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Цена (₽)</label>
                        <input type="number" name="price" class="form-control" value="{{ ad.price }}" required min="1">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Ссылка на изображение (URL)</label>
                        <input type="url" name="image_url" class="form-control" value="{{ ad.image_url or '' }}" placeholder="https://...">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Описание</label>
                        <textarea name="description" class="form-control" rows="5" required>{{ ad.description }}</textarea>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="/ads/{{ ad.id }}" class="btn btn-secondary">Назад</a>
                        <button type="submit" class="btn btn-primary">Сохранить изменения</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
