{% extends 'base.html' %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h4 class="card-title text-center mb-3">Вход / Регистрация</h4>
          <form action="/login" method="post">
            <div class="mb-3">
              <label class="form-label">Ваше имя или логин:</label>
              <input type="text" name="username" class="form-control" placeholder="Например, Иван или Ольга" required />
            </div>
            <button type="submit" class="btn btn-primary w-100">Войти</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
