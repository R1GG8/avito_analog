{% extends 'base.html' %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <h4 class="card-title text-center mb-3">Регистрация аккаунта</h4>

          {% if error %}
            <div class="alert alert-danger py-2" role="alert">
              <small>{{ error }}</small>
            </div>
          {% endif %}

          <!-- Форма отправляет данные на /auth/register -->
          <form action="/auth/register" method="post">
            <div class="mb-3">
              <label class="form-label">Логин (Имя пользователя)</label>
              <input type="text" name="username" class="form-control" required minlength="3" placeholder="ivan_dev" />
            </div>
            <div class="mb-3">
              <label class="form-label">Электронная почта (Email)</label>
              <input type="email" name="email" class="form-control" required placeholder="ivan@example.com" />
            </div>
            <div class="mb-3">
              <label class="form-label">Пароль (не менее 6 символов)</label>
              <input type="password" name="password" class="form-control" required minlength="6" placeholder="••••••••" />
            </div>
            <div class="mb-3">
              <label class="form-label">Подтверждение пароля</label>
              <input type="password" name="password_confirm" class="form-control" required minlength="6" placeholder="••••••••" />
            </div>
            <button type="submit" class="btn btn-success w-100 mb-3">Зарегистрироваться</button>
          </form>

          <div class="text-center">
            <small class="text-muted">Уже есть аккаунт? <a href="/login-page">Войти</a></small>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
