<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Avito Аналог</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/">Avito Lite</a>
        <div class="d-flex align-items-center">
          {% if current_user %}
            <!-- Ссылка на профиль -->
            <a href="/profile" class="btn btn-light btn-sm me-2 fw-bold">Мой профиль ({{ current_user.username }})</a>
            <a href="/auth/logout" class="btn btn-outline-light btn-sm">Выйти</a>
          {% else %}
            <a href="/login-page" class="btn btn-light btn-sm me-2">Войти</a>
            <a href="/register-page" class="btn btn-warning btn-sm">Регистрация</a>
          {% endif %}
        </div>
      </div>
    </nav>

    <div class="container pb-5">
      {% block content %}

      {% endblock %}
    </div>

    <!-- Скрипт Bootstrap (нужен для переключения вкладок в профиле) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
