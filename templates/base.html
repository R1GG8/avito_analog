<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Avito Аналог</title>
    <!-- Подключаем Bootstrap для красивого оформления -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/">Avito Lite</a>
        <div class="d-flex align-items-center">
          {% if current_user %}
            <span class="text-white me-3">Вы вошли как: <b>{{ current_user.username }}</b> (ID: <code>{{ current_user.id }}</code>)</span>
            <a href="/logout" class="btn btn-outline-light btn-sm">Выйти</a>
          {% else %}
            <a href="/login-page" class="btn btn-light btn-sm">Войти / Регистрация</a>
          {% endif %}
        </div>
      </div>
    </nav>

    <div class="container">
      {% block content %}
      {% endblock %}
    </div>
  </body>
</html>
